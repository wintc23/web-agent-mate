[package]
name = "webagentmate-bridge"
version = "0.2.2"
edition = "2021"
license = "Proprietary"

[dependencies]
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
